[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhin-hinh-doan-chuyen-backend"
version = "0.1.0"
description = "Backend scaffold for Memes On Air"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9,<3.0",
  "httpx>=0.27",
  "pillow>=10.0",
  "anthropic>=1.0",
  "jsonschema>=4.20",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
# Package C adds Pillow; Package D adds Celery/Redis.
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set so a new ruff release cannot change what CI enforces.
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "E501"]  # imported pytest fixtures; long test data lines
