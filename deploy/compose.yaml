# Run with the root .env so variables are interpolated and passed consistently:
#   docker compose --env-file ../.env -f deploy/compose.yaml up -d --build   (from the repo root)
#   docker compose --env-file ../.env up -d --build                          (from deploy/)
services:
  api:
    build: ../backend
    env_file: ../.env
    ports:
      - "127.0.0.1:${NHD_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  worker:
    # Runs the scheduler tick (docs/workflow.md). Dry-run unless NHD_PUBLISH_MODE=live.
    build: ../backend
    command: ["python", "-m", "app.worker"]
    env_file: ../.env
    environment:
      NHD_MEDIA_DIR: /app/media
    volumes:
      - ../media:/app/media:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env} -d ${POSTGRES_DB:?set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
