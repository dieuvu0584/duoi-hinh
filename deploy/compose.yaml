# Run with the root .env so variables are interpolated and passed consistently:
#   docker compose --env-file ../.env -f deploy/compose.yaml up -d --build   (from the repo root)
#   docker compose --env-file ../.env up -d --build                          (from deploy/)
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      NHD_MEDIA_DIR: /app/media
    volumes:
      - ../media:/app/media:ro  # review previews are served from here
    ports:
      # Localhost by default. Set NHD_BIND_ADDR to this PC's Tailscale IP (tailscale ip -4) to reach the
      # API from the phone; never 0.0.0.0 (that would expose it on the LAN/Internet).
      - "${NHD_BIND_ADDR:-127.0.0.1}:${NHD_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  worker:
    # Runs the scheduler tick (docs/workflow.md). Dry-run unless NHD_PUBLISH_MODE=live.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: ../.env
    environment:
      NHD_MEDIA_DIR: /app/media
      # Rendering runs on the PC's CPU: veryfast keeps a render to about a minute instead of ~8.
      NHD_X264_PRESET: veryfast
      # LIVE publishing. Nothing goes out until the owner also turns the kill switch off, turns
      # automation on and approves a post. Set to dry_run (here) to rehearse without posting.
      NHD_PUBLISH_MODE: live
    volumes:
      - ../media:/app/media  # the worker writes generated media here
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env} -d ${POSTGRES_DB:?set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
