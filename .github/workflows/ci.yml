name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nhd
          POSTGRES_PASSWORD: nhd_test
          POSTGRES_DB: nhd_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U nhd -d nhd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NHD_TEST_DATABASE_URL: postgresql+psycopg://nhd:nhd_test@127.0.0.1:5433/nhd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools for rendering tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test (includes migrations from an empty database)
        working-directory: backend
        run: pytest -q
      - name: Spike script tests (fake Meta server)
        run: pip install httpx pytest && pytest -q spikes/tests
